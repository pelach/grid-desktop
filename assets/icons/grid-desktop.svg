<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sötét felületi gradiens lágy mélységgel -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242730" />
      <stop offset="100%" stop-color="#121318" />
    </linearGradient>

    <!-- Fő akcentus gradiens (élénk kék-cián a widget stílushoz) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4" />
      <stop offset="100%" stop-color="#1c71d8" />
    </linearGradient>

    <!-- Kiemelés és üveg tükröződés -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78aeed" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Lágy árnyék a kiemelt widgetnek -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Alap konténer / lekerekített kártya háttér -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#glassBorder)" stroke-width="1.5" />

  <!-- 2. Asztali Rács Pontok / Háló (Grid mintázat a háttérben) -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="28" cy="28" r="2.5" />
    <circle cx="52" cy="28" r="2.5" />
    <circle cx="76" cy="28" r="2.5" />
    <circle cx="100" cy="28" r="2.5" />

    <circle cx="28" cy="52" r="2.5" />
    <circle cx="28" cy="76" r="2.5" />
    <circle cx="28" cy="100" r="2.5" />

    <circle cx="100" cy="52" r="2.5" />
    <circle cx="100" cy="76" r="2.5" />
    <circle cx="100" cy="100" r="2.5" />
    
    <circle cx="52" cy="100" r="2.5" />
    <circle cx="76" cy="100" r="2.5" />
  </g>

  <!-- 3. Rácsra illeszkedő aktív moduláris widget (lebegő kiemelés) -->
  <g filter="url(#dropShadow)">
    <rect x="36" y="36" width="56" height="56" rx="14" fill="url(#accentGrad)" />
    <rect x="36" y="36" width="56" height="56" rx="14" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35" />
  </g>

  <!-- 4. Dinamikus zenei / médiahullám az aktív widget belsejében -->
  <g fill="url(#waveGrad)">
    <rect x="46" y="58" width="4" height="12" rx="2" />
    <rect x="54" y="49" width="4" height="30" rx="2" />
    <rect x="62" y="44" width="4" height="40" rx="2" />
    <rect x="70" y="52" width="4" height="24" rx="2" />
    <rect x="78" y="60" width="4" height="8" rx="2" />
  </g>

  <!-- 5. Apró állapottelep / élő adás pötty a kártya sarkában -->
  <circle cx="82" cy="44" r="2.5" fill="#57e389" />
</svg>