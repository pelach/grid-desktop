<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <style>
      .widget-bg { fill: #202b38; rx: 14px; }
      .phase-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #ffffff; opacity: 0.55; }
      .timer-text { font-family: system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 300; fill: #ffffff; }
      .btn-bg { fill: rgba(255, 255, 255, 0.08); rx: 14px; }
      .icon-fill { fill: #ffffff; }
    </style>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="220" height="220" class="widget-bg" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- Kör alakú progress arc (középen, 196px átmérő) -->
  <circle cx="110" cy="110" r="85" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6" />
  <circle cx="110" cy="110" r="85" fill="none" stroke="#3584e4" stroke-width="6"
          stroke-dasharray="534.07" stroke-dashoffset="133.5"
          stroke-linecap="round" transform="rotate(-90 110 110)" />

  <!-- Belső tartalom: Címke és Időzítő -->
  <text x="110" y="76" text-anchor="middle" class="phase-text">Focus</text>
  <text x="110" y="108" text-anchor="middle" class="timer-text">25:00</text>

  <!-- 4 darab session állapotpont -->
  <g transform="translate(110, 124)">
    <circle cx="-18" cy="0" r="4" fill="#3584e4" />
    <circle cx="-6" cy="0" r="4" fill="#ffffff" opacity="0.2" />
    <circle cx="6" cy="0" r="4" fill="#ffffff" opacity="0.2" />
    <circle cx="18" cy="0" r="4" fill="#ffffff" opacity="0.2" />
  </g>

  <!-- Vezérlőgombok alul (Reset, Play, Skip) -->
  <g transform="translate(110, 156)">
    <!-- 1. Reset gomb -->
    <g transform="translate(-40, 0)">
      <circle cx="0" cy="0" r="14" class="btn-bg" />
      <path d="M 4 -3 A 6 6 0 1 0 5 3" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.75" />
      <polyline points="2,-6 5,-3 1,-2" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.75" />
    </g>

    <!-- 2. Play gomb (kiemelt méret) -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="17" fill="#3584e4" />
      <polygon points="-3,-6 6,0 -3,6" fill="#ffffff" />
    </g>

    <!-- 3. Skip gomb -->
    <g transform="translate(40, 0)">
      <circle cx="0" cy="0" r="14" class="btn-bg" />
      <polygon points="-4,-5 2,0 -4,5" fill="#ffffff" opacity="0.75" />
      <line x1="4" y1="-5" x2="4" y2="5" stroke="#ffffff" stroke-width="1.4" opacity="0.75" />
    </g>
  </g>
</svg>
