<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180">
  <defs>
    <style>
      .widget-bg { fill: #202b38; rx: 14px; }
      .timer-text { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 300; fill: #ffffff; }
      .caption-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #ffffff; opacity: 0.65; letter-spacing: 0.5px; }
      .mode-bg { fill: rgba(255, 255, 255, 0.06); rx: 10px; }
      .mode-active-bg { fill: rgba(53, 132, 228, 0.25); rx: 7px; }
      .mode-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #ffffff; font-weight: 500; }
      .counter-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #ffffff; }
      .counter-dim { fill: #ffffff; opacity: 0.65; }
      .btn-start { fill: #3584e4; rx: 8px; }
      .btn-reset { fill: transparent; stroke: rgba(255, 255, 255, 0.16); stroke-width: 1; rx: 8px; }
      .btn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #ffffff; }
    </style>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="360" height="180" class="widget-bg" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- BAL OLDAL: Kör alakú progress gauge (130px) -->
  <g transform="translate(20, 25)">
    <!-- Háttér ívgyűrű -->
    <circle cx="65" cy="65" r="54" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6" />
    <!-- Aktív progress ív (kb. 75% fázis) -->
    <circle cx="65" cy="65" r="54" fill="none" stroke="#3584e4" stroke-width="6"
            stroke-dasharray="339.29" stroke-dashoffset="85"
            stroke-linecap="round" transform="rotate(-90 65 65)" />

    <!-- Időzítő szöveg a közepén -->
    <text x="65" y="67" text-anchor="middle" class="timer-text">25:00</text>
    <text x="65" y="85" text-anchor="middle" class="caption-text">WORK</text>
  </g>

  <!-- JOBB OLDAL: Vezérlők -->
  <g transform="translate(170, 20)">
    <!-- 1. Módválasztó kapszula (Work | Break) -->
    <rect x="0" y="0" width="168" height="30" class="mode-bg" />
    <rect x="3" y="3" width="80" height="24" class="mode-active-bg" />
    <text x="43" y="19" text-anchor="middle" class="mode-text">Work</text>
    <text x="124" y="19" text-anchor="middle" class="mode-text" opacity="0.6">Break</text>

    <!-- 2. Completed számláló sor -->
    <g transform="translate(0, 56)">
      <text x="84" y="0" text-anchor="middle" class="counter-text">
        <tspan class="counter-dim">Completed: </tspan>
        <tspan font-weight="bold">1</tspan>
        <tspan class="counter-dim"> / 4</tspan>
      </text>
    </g>

    <!-- 3. Start és Reset akciógombok -->
    <g transform="translate(0, 96)">
      <!-- Start gomb (Kék akcentus) -->
      <rect x="0" y="0" width="80" height="34" class="btn-start" />
      <text x="40" y="21" text-anchor="middle" class="btn-text">Start</text>

      <!-- Reset gomb (Keretes, áttetsző) -->
      <rect x="88" y="0" width="80" height="34" class="btn-reset" />
      <text x="128" y="21" text-anchor="middle" class="btn-text" opacity="0.8">Reset</text>
    </g>
  </g>
</svg>
