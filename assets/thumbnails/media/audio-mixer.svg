<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 176" width="360" height="176">
  <defs>
    <style>
      .bg { fill: #212126; stroke: rgba(0, 0, 0, 0.75); stroke-width: 1.5; rx: 16px; }
      .header-title { font-family: 'Cantarell', 'Ubuntu', sans-serif; font-size: 13.5px; font-weight: bold; fill: #ffffff; opacity: 0.9; }
      .pct { font-family: 'Cantarell', 'Ubuntu', sans-serif; font-size: 11.5px; font-weight: bold; fill: #ffffff; text-anchor: end; dominant-baseline: central; }
      .track { fill: rgba(255, 255, 255, 0.08); rx: 10px; }
      .btn-bg { fill: rgba(255, 255, 255, 0.10); }
      .slider-master { fill: #b8e2f8; rx: 10px; }
      .slider-app { fill: #a3c9be; rx: 10px; }
      .icon-fill { fill: #ffffff; }
    </style>
  </defs>

  <!-- Kártya háttér -->
  <rect width="358.5" height="174.5" x="0.75" y="0.75" class="bg" />

  <!-- 1. Fejléc (Audio Mixer) -->
  <g transform="translate(18, 16)">
    <!-- Hangszóró ikon -->
    <path class="icon-fill" d="M2 5.5v3h2.5l3.5 3.5V2L4.5 5.5H2zm8-.5c0 1.2-.5 2.3-1.4 3l.7.7c1.1-.9 1.7-2.3 1.7-3.7s-.6-2.8-1.7-3.7l-.7.7c.9.7 1.4 1.8 1.4 3z" transform="translate(0, 1) scale(1.1)" />
    <text x="18" y="11" class="header-title">Audio Mixer</text>
  </g>

  <!-- 2. Master sor (Y = 46) -->
  <g transform="translate(18, 46)">
    <!-- Bal gomb -->
    <circle cx="12" cy="11" r="12" class="btn-bg" />
    <path class="icon-fill" d="M7 9v4h2.5l3 3V6l-3 3H7zm7-.5c0 1.1-.5 2-1.3 2.6l.7.7c1-.8 1.6-2 1.6-3.3s-.6-2.5-1.6-3.3l-.7.7c.8.6 1.3 1.5 1.3 2.6z" />

    <!-- Csúszka alap sáv (Szélesség: 260px, Magasság: 20px) -->
    <rect x="32" y="1" width="260" height="20" class="track" />
    <!-- Aktív kitöltés (23% -> 60px) -->
    <rect x="32" y="1" width="60" height="20" class="slider-master" />

    <!-- Százalék felirat -->
    <text x="324" y="11" class="pct">23%</text>
  </g>

  <!-- 3. Alkalmazás sor 1: Chrome / Videó (Y = 86) -->
  <g transform="translate(18, 86)">
    <!-- Bal gomb -->
    <circle cx="12" cy="11" r="12" class="btn-bg" />
    <!-- Kis lejátszás / app piktogram -->
    <polygon points="10,6 16,11 10,16" fill="#3584e4" />

    <!-- Csúszka sáv -->
    <rect x="32" y="1" width="260" height="20" class="track" />
    <!-- Aktív kitöltés (41% -> 106px) -->
    <rect x="32" y="1" width="106" height="20" class="slider-app" />

    <!-- Százalék felirat -->
    <text x="324" y="11" class="pct">41%</text>
  </g>

  <!-- 4. Alkalmazás sor 2: Zene / Média (Y = 126) -->
  <g transform="translate(18, 126)">
    <!-- Bal gomb -->
    <circle cx="12" cy="11" r="12" class="btn-bg" />
    <!-- Zenehang piktogram -->
    <path fill="#e62d42" d="M9 13.5a2 2 0 1 1-1.5-1.9V6.5l6-1.5v6.5a2 2 0 1 1-1.5-1.9V7.2l-3 .8v5.5z" />

    <!-- Csúszka sáv -->
    <rect x="32" y="1" width="260" height="20" class="track" />
    <!-- Aktív kitöltés (41% -> 106px) -->
    <rect x="32" y="1" width="106" height="20" class="slider-app" />

    <!-- Százalék felirat -->
    <text x="324" y="11" class="pct">41%</text>
  </g>
</svg>