<svg width="240" height="160" viewBox="0 0 240 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Háttér kártya -->
  <rect width="240" height="160" rx="16" fill="#212126" />

  <!-- Finom fejléces hangjegy ikon a bal felső sarokban -->
  <g opacity="0.35" transform="translate(24, 20)">
    <path d="M12 3V13.55C11.41 13.21 10.73 13 10 13C7.79 13 6 14.79 6 17C6 19.21 7.79 21 10 21C12.21 21 14 19.21 14 17V7H18V3H12Z" fill="#FFFFFF" />
  </g>

  <!-- Korábbi sorok (halvány, elúszó szövegcsíkok) -->
  <g opacity="0.25">
    <rect x="24" y="44" width="120" height="7" rx="3.5" fill="#FFFFFF" />
    <rect x="24" y="60" width="165" height="7" rx="3.5" fill="#FFFFFF" />
  </g>

  <!-- AKTUÁLIS, KIEMELT SOR (fényes, aktív fókusz) -->
