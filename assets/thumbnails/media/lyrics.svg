    <!-- Kiemelő kis kapszula indikátor a sor előtt -->
    <rect x="18" y="77" width="3" height="16" rx="1.5" fill="#3584E4" />
    <!-- Erős, aktív szövegsor reprezentáció -->
    <rect x="26" y="80" width="180" height="10" rx="5" fill="#FFFFFF" />
  </g>

  <!-- Következő sorok (fokozatosan sötétedő sorok) -->
  <g opacity="0.4">
    <rect x="24" y="103" width="145" height="7" rx="3.5" fill="#FFFFFF" />
  </g>
  <g opacity="0.2">
    <rect x="24" y="119" width="110" height="7" rx="3.5" fill="#FFFFFF" />
    <rect x="24" y="135" width="130" height="7" rx="3.5" fill="#FFFFFF" />
  </g>

  <!-- Vékony stílusos scrollbar a jobb szélen -->
  <rect x="224" y="32" width="3" height="96" rx="1.5" fill="#FFFFFF" fill-opacity="0.08" />
  <rect x="224" y="68" width="3" height="28" rx="1.5" fill="#FFFFFF" fill-opacity="0.45" />
