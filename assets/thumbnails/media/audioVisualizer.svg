      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0.95" />
    </linearGradient>

    <!-- Halvány derengés a hullámvonal aljához -->
    <linearGradient id="glow-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0.18" />
    </linearGradient>
  </defs>

  <!-- Kártya háttér -->
  <rect width="400" height="200" rx="24" ry="24" fill="#212126" />

  <!-- Finom keret -->
  <rect width="400" height="200" rx="24" ry="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- ================= FEJLÉC ================= -->
  <g transform="translate(20, 20)">
