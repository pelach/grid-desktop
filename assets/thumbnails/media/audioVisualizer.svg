    <!-- Cím -->
    <text x="24" y="14" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" opacity="0.9">Audio Spectrum</text>

    <!-- Jobb: LIVE felirat -->
    <text x="360" y="14" fill="#3584e4" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="end" letter-spacing="1.5" opacity="0.85">LIVE</text>
  </g>

