<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="deckBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202b38" />
      <stop offset="100%" stop-color="#161e27" />
    </linearGradient>
    <linearGradient id="slideGradFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b6cb0" />
      <stop offset="100%" stop-color="#1a365d" />
    </linearGradient>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="200" height="200" rx="14" fill="url(#deckBg)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- 1. Hátsó fotókártya (elforgatva, rétegzett galéria hatás) -->
  <g transform="translate(100, 95) rotate(-7) translate(-70, -60)">
    <rect width="140" height="120" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  </g>

  <!-- 2. Középső fotókártya -->
  <g transform="translate(100, 95) rotate(5) translate(-70, -60)">
    <rect width="140" height="120" rx="8" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  </g>

  <!-- 3. Fő elülső fotókártya (éles és vízszintes) -->
  <g transform="translate(30, 32)">
    <rect width="140" height="120" rx="8" fill="url(#slideGradFront)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />

    <!-- Tájképes tartalom -->
    <circle cx="106" cy="38" r="11" fill="#f6ad55" />
    <polygon points="14,119 54,68 94,119" fill="#1e293b" opacity="0.9" />
    <polygon points="58,119 96,78 134,119" fill="#334155" />

    <!-- Diavetítés / Áttűnés ikon a jobb felső sarokban -->
    <g transform="translate(14, 14)">
      <!-- Kis dia/galéria szimbólum -->
      <rect x="0" y="0" width="16" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.85" />
      <path d="M 4 15 L 18 15" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- Lapozó / diaváltó indikátor nyilak az alján -->
    <g transform="translate(70, 108)">
      <circle cx="-12" cy="0" r="1.8" fill="#ffffff" opacity="0.4" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
      <circle cx="12" cy="0" r="1.8" fill="#ffffff" opacity="0.4" />
    </g>
  </g>
</svg>
