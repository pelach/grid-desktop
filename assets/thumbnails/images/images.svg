<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="imgCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#243042" />
      <stop offset="100%" stop-color="#18202c" />
    </linearGradient>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4365" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <style>
      .gif-badge { fill: rgba(255, 255, 255, 0.15); rx: 4px; }
      .gif-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="200" height="200" rx="14" fill="url(#imgCardBg)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- Belső képkeret -->
  <g transform="translate(18, 18)">
    <rect width="164" height="164" rx="10" fill="url(#photoGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

    <!-- Nap / Hold a képen -->
    <circle cx="122" cy="48" r="14" fill="#ffd166" opacity="0.9" />

    <!-- Háttér hegycsúcs (sötétebb kék) -->
    <polygon points="18,163 78,82 128,163" fill="#2d3748" opacity="0.95" />

    <!-- Előtér hegycsúcs (világosabb akcentus) -->
    <polygon points="64,163 118,98 163,163" fill="#4a5568" />
    <polygon points="118,98 134,120 124,124 118,98" fill="#e2e8f0" opacity="0.8" />

    <!-- GIF jelvény a bal felső sarokban -->
    <g transform="translate(12, 12)">
      <rect width="32" height="18" class="gif-badge" />
      <text x="16" y="13" text-anchor="middle" class="gif-text">GIF</text>
    </g>
  </g>
</svg>
