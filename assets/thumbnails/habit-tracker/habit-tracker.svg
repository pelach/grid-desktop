<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <style>
      .bg { fill: #1e1e24; rx: 14px; }
      .header-text { fill: #ffffff; opacity: 0.55; font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: bold; letter-spacing: 0.5px; }
      .row-bg { fill: #ffffff; fill-opacity: 0.06; rx: 8px; }
      .item-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 8px; font-weight: 500; }
      .streak-bg { fill: #ffffff; fill-opacity: 0.08; rx: 5px; }
      .streak-text { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 6.5px; font-weight: bold; text-anchor: middle; }
      .day-circle-off { fill: none; stroke: #ffffff; stroke-opacity: 0.2; stroke-width: 0.8; }
      .day-text-off { fill: #ffffff; font-family: system-ui, -apple-system, sans-serif; font-size: 5px; font-weight: bold; text-anchor: middle; }
      .day-text-on { fill: #1e1e1e; font-family: system-ui, -apple-system, sans-serif; font-size: 5px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- Widget Card Háttér -->
  <rect width="240" height="160" class="bg" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

  <!-- Fejléc -->
  <circle cx="16" cy="18" r="3" fill="#4ade80" />
  <text x="25" y="21" class="header-text">HABIT TRACKER</text>
  
  <!-- Fejléc Add Gomb (+) -->
  <circle cx="224" cy="18" r="7" fill="#ffffff" fill-opacity="0.12" />
  <path d="M 224 14.5 L 224 21.5 M 220.5 18 L 227.5 18" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

  <!-- 1. SOR: Code Daily -->
  <g transform="translate(10, 32)">
    <rect width="220" height="34" class="row-bg" />
    <text x="10" y="20" class="item-text">Code Daily</text>
    
    <!-- Streak -->
    <rect x="74" y="11" width="22" height="12" class="streak-bg" />
    <text x="85" y="20" class="streak-text">18d</text>

    <!-- Hét napjai (Szín: #C2E7FF) -->
    <!-- M (on) -->
    <circle cx="112" cy="17" r="6" fill="#C2E7FF" />
    <text x="112" y="19" class="day-text-on">M</text>
    <!-- T (on) -->
    <circle cx="128" cy="17" r="6" fill="#C2E7FF" />
    <text x="128" y="19" class="day-text-on">T</text>
    <!-- W (on) -->
    <circle cx="144" cy="17" r="6" fill="#C2E7FF" />
    <text x="144" y="19" class="day-text-on">W</text>
    <!-- T (on) -->
    <circle cx="160" cy="17" r="6" fill="#C2E7FF" />
    <text x="160" y="19" class="day-text-on">T</text>
    <!-- F (on) -->
    <circle cx="176" cy="17" r="6" fill="#C2E7FF" />
    <text x="176" y="19" class="day-text-on">F</text>
    <!-- S (off) -->
    <circle cx="192" cy="17" r="6" class="day-circle-off" />
    <text x="192" y="19" class="day-text-off">S</text>
    <!-- S (off) -->
    <circle cx="208" cy="17" r="6" class="day-circle-off" />
    <text x="208" y="19" class="day-text-off">S</text>
  </g>

  <!-- 2. SOR: Hydrate (2L) -->
  <g transform="translate(10, 72)">
    <rect width="220" height="34" class="row-bg" />
    <text x="10" y="20" class="item-text">Hydrate (2L)</text>
    
    <!-- Streak -->
    <rect x="74" y="11" width="22" height="12" class="streak-bg" />
    <text x="85" y="20" class="streak-text">12d</text>

    <!-- Hét napjai (Szín: #A2C9C2) -->
    <!-- M (on) -->
    <circle cx="112" cy="17" r="6" fill="#A2C9C2" />
    <text x="112" y="19" class="day-text-on">M</text>
    <!-- T (on) -->
    <circle cx="128" cy="17" r="6" fill="#A2C9C2" />
    <text x="128" y="19" class="day-text-on">T</text>
    <!-- W (on) -->
    <circle cx="144" cy="17" r="6" fill="#A2C9C2" />
    <text x="144" y="19" class="day-text-on">W</text>
    <!-- T (on) -->
    <circle cx="160" cy="17" r="6" fill="#A2C9C2" />
    <text x="160" y="19" class="day-text-on">T</text>
    <!-- F (off) -->
    <circle cx="176" cy="17" r="6" class="day-circle-off" />
    <text x="176" y="19" class="day-text-off">F</text>
    <!-- S (off) -->
    <circle cx="192" cy="17" r="6" class="day-circle-off" />
    <text x="192" y="19" class="day-text-off">S</text>
    <!-- S (off) -->
    <circle cx="208" cy="17" r="6" class="day-circle-off" />
    <text x="208" y="19" class="day-text-off">S</text>
  </g>

  <!-- 3. SOR: Read / Study -->
  <g transform="translate(10, 112)">
    <rect width="220" height="34" class="row-bg" />
    <text x="10" y="20" class="item-text">Read / Study</text>
    
    <!-- Streak -->
    <rect x="74" y="11" width="22" height="12" class="streak-bg" />
    <text x="85" y="20" class="streak-text">7d</text>

    <!-- Hét napjai (Szín: #FFE082) -->
    <!-- M (on) -->
    <circle cx="112" cy="17" r="6" fill="#FFE082" />
    <text x="112" y="19" class="day-text-on">M</text>
    <!-- T (on) -->
    <circle cx="128" cy="17" r="6" fill="#FFE082" />
    <text x="128" y="19" class="day-text-on">T</text>
    <!-- W (off) -->
    <circle cx="144" cy="17" r="6" class="day-circle-off" />
    <text x="144" y="19" class="day-text-off">W</text>
    <!-- T (on) -->
    <circle cx="160" cy="17" r="6" fill="#FFE082" />
    <text x="160" y="19" class="day-text-on">T</text>
    <!-- F (off) -->
    <circle cx="176" cy="17" r="6" class="day-circle-off" />
    <text x="176" y="19" class="day-text-off">F</text>
    <!-- S (off) -->
    <circle cx="192" cy="17" r="6" class="day-circle-off" />
    <text x="192" y="19" class="day-text-off">S</text>
    <!-- S (off) -->
    <circle cx="208" cy="17" r="6" class="day-circle-off" />
    <text x="208" y="19" class="day-text-off">S</text>
  </g>
</svg>
