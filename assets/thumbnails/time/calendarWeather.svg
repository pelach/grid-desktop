        <circle cx="0" cy="-4" r="11" fill="#3584e4" />
        <text x="0" y="0" fill="#ffffff" font-weight="700">7</text>
      </g>
      <text x="43" y="60" fill="#ffffff" fill-opacity="0.85">8</text>
      <text x="72" y="60" fill="#ffffff" fill-opacity="0.85">9</text>
      <text x="101" y="60" fill="#ffffff" fill-opacity="0.85">10</text>
      <text x="130" y="60" fill="#ffffff" fill-opacity="0.85">11</text>
      <text x="159" y="60" fill="#3584e4" font-weight="600">12</text>
      <text x="188" y="60" fill="#3584e4" font-weight="600">13</text>

      <!-- 3. sor -->
      <text x="14" y="82" fill="#ffffff" fill-opacity="0.85">14</text>
      <text x="43" y="82" fill="#ffffff" fill-opacity="0.85">15</text>
      <text x="72" y="82" fill="#ffffff" fill-opacity="0.85">16</text>
      <text x="101" y="82" fill="#ffffff" fill-opacity="0.85">17</text>
      <text x="130" y="82" fill="#ffffff" fill-opacity="0.85">18</text>
      <text x="159" y="82" fill="#3584e4" font-weight="600">19</text>
      <text x="188" y="82" fill="#3584e4" font-weight="600">20</text>

      <!-- 4. sor -->
      <text x="14" y="104" fill="#ffffff" fill-opacity="0.85">21</text>
      <text x="43" y="104" fill="#ffffff" fill-opacity="0.85">22</text>
      <text x="72" y="104" fill="#ffffff" fill-opacity="0.85">23</text>
      <text x="101" y="104" fill="#ffffff" fill-opacity="0.85">24</text>
      <text x="130" y="104" fill="#ffffff" fill-opacity="0.85">25</text>
      <text x="159" y="104" fill="#3584e4" font-weight="600">26</text>
      <text x="188" y="104" fill="#3584e4" font-weight="600">27</text>

      <!-- 5. sor -->
      <text x="14" y="126" fill="#ffffff" fill-opacity="0.85">28</text>
      <text x="43" y="126" fill="#ffffff" fill-opacity="0.85">29</text>
      <text x="72" y="126" fill="#ffffff" fill-opacity="0.85">30</text>
      <text x="101" y="126" fill="#ffffff" fill-opacity="0.85">31</text>
      <text x="130" y="126" fill="#ffffff" fill-opacity="0.25">1</text>
      <text x="159" y="126" fill="#3584e4" fill-opacity="0.4" font-weight="600">2</text>
      <text x="188" y="126" fill="#3584e4" fill-opacity="0.4" font-weight="600">3</text>

      <!-- 6. sor -->
      <text x="14" y="148" fill="#ffffff" fill-opacity="0.25">4</text>
      <text x="43" y="148" fill="#ffffff" fill-opacity="0.25">5</text>
      <text x="72" y="148" fill="#ffffff" fill-opacity="0.25">6</text>
      <text x="101" y="148" fill="#ffffff" fill-opacity="0.25">7</text>
      <text x="130" y="148" fill="#ffffff" fill-opacity="0.25">8</text>
      <text x="159" y="148" fill="#3584e4" fill-opacity="0.4" font-weight="600">9</text>
      <text x="188" y="148" fill="#3584e4" fill-opacity="0.4" font-weight="600">10</text>
