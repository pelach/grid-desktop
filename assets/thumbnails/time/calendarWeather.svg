<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <!-- Widget kártya háttér és lekerekítés -->
    <clipPath id="card-clip">
      <rect width="400" height="200" rx="24" ry="24" />
    </clipPath>
  </defs>

  <!-- Kártya háttér -->
  <rect width="400" height="200" rx="24" ry="24" fill="#212126" />

  <!-- Finom szegély -->
  <rect width="400" height="200" rx="24" ry="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- ================= BAL OLDAL: DÁTUM ÉS IDŐJÁRÁS ================= -->
  <g transform="translate(28, 0)">
    <!-- Hónap -->
    <text x="0" y="44" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">DECEMBER</text>

    <!-- Nap neve (Accent kék színnel) -->
    <text x="0" y="66" fill="#3584e4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Monday</text>

    <!-- Nagy mai nap szám -->
    <text x="0" y="132" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="300">7</text>

    <!-- Időjárás csoport -->
    <g transform="translate(0, 156)">
      <!-- Időjárás ikon: felhő mögül kikandikáló napocska -->
      <g transform="translate(0, -11) scale(0.85)">
        <!-- Nap sugarak és korong -->
        <circle cx="17" cy="7" r="4" fill="#f6d32d" />
        <path d="M17 1v2 M17 11v2 M11 7h2 M21 7h2 M12.8 2.8l1.4 1.4 M19.8 9.8l1.4 1.4 M12.8 11.2l1.4-1.4 M19.8 4.2l1.4-1.4" stroke="#f6d32d" stroke-width="1.5" stroke-linecap="round" />
        <!-- Felhő -->
        <path d="M6 16 a4.5 4.5 0 0 1 8.2 -2.2 a3.5 3.5 0 0 1 5.3 3.2 a3 3 0 0 1 -3 3 h-10.5 a4 4 0 0 1 0 -8 z" fill="#deddda" />
      </g>
      <!-- Hőmérséklet érték -->
      <text x="26" y="2" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" opacity="0.9">25°/13°</text>
    </g>
  </g>

  <!-- Függőleges elválasztó vonal -->
  <line x1="152" y1="24" x2="152" y2="176" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- ================= JOBB OLDAL: NAPTÁRRÁCS ================= -->
  <g transform="translate(176, 26)">
    <!-- Hét napjai fejléc (M T W T F S S) -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      <text x="14" y="12" fill="#3584e4">M</text>
      <text x="43" y="12" fill="#ffffff" fill-opacity="0.4">T</text>
      <text x="72" y="12" fill="#ffffff" fill-opacity="0.4">W</text>
      <text x="101" y="12" fill="#ffffff" fill-opacity="0.4">T</text>
      <text x="130" y="12" fill="#ffffff" fill-opacity="0.4">F</text>
      <text x="159" y="12" fill="#ffffff" fill-opacity="0.4">S</text>
      <text x="188" y="12" fill="#ffffff" fill-opacity="0.4">S</text>
    </g>

    <!-- Napok számai -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">
      <!-- 1. sor -->
      <text x="14" y="38" fill="#ffffff" fill-opacity="0.25">30</text>
      <text x="43" y="38" fill="#ffffff" fill-opacity="0.85">1</text>
      <text x="72" y="38" fill="#ffffff" fill-opacity="0.85">2</text>
      <text x="101" y="38" fill="#ffffff" fill-opacity="0.85">3</text>
      <text x="130" y="38" fill="#ffffff" fill-opacity="0.85">4</text>
      <text x="159" y="38" fill="#3584e4" font-weight="600">5</text>
      <text x="188" y="38" fill="#3584e4" font-weight="600">6</text>

      <!-- 2. sor (Aktív kiválasztott nappal: 7) -->
