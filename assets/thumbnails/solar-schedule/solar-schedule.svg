<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <style>
      .widget-bg { fill: #202b38; rx: 14px; }
      .city-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #ffffff; opacity: 0.65; }
      .time-val { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .status-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #ffffff; opacity: 0.65; }
      .icon-stroke { fill: none; stroke: #ffffff; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="240" height="240" class="widget-bg" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- 1. Városnév felül -->
  <text x="20" y="32" class="city-name">Kathmandu</text>

  <!-- 2. Gauss nap-ív (Solar Arch) és az égitest -->
  <g transform="translate(0, 20)">
    <!-- Alap háttér ívpálya (halvány szürke/kék) -->
    <path d="M 32 135 
             C 65 135 88 52 120 52 
             C 152 52 175 135 208 135" 
          fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Aktív bejárt ív (pirosas-narancs vagy akcentuskék téma) -->
    <path d="M 32 135 
             C 65 135 88 52 120 52" 
          fill="none" stroke="#e0534c" stroke-width="3" stroke-linecap="round" />

    <!-- Nap orb a delelőponton (középen) -->
    <circle cx="120" cy="52" r="6" fill="#e0534c" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Finom vízszintes elválasztó vonal -->
  <line x1="20" y1="184" x2="220" y2="184" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- 3. Lábléc: Napkelte & Napnyugta adatok -->
  <g transform="translate(20, 196)">
    <!-- Napkelte (bal oldal) -->
    <g transform="translate(0, 0)">
      <!-- Sunrise szimbólum -->
      <g transform="translate(0, 6)" class="icon-stroke" stroke-width="1.4" opacity="0.75">
        <path d="M 2 12 L 18 12" />
        <path d="M 6 12 A 4 4 0 0 1 14 12" />
        <polyline points="7,5 10,2 13,5" />
        <line x1="10" y1="2" x2="10" y2="9" />
      </g>
      <text x="26" y="14" class="time-val">05:48</text>
      <text x="26" y="27" class="status-sub">In 7h 45m</text>
    </g>

    <!-- Napnyugta (jobb oldal) -->
    <g transform="translate(132, 0)">
      <!-- Sunset szimbólum -->
      <g transform="translate(0, 6)" class="icon-stroke" stroke-width="1.4" opacity="0.75">
        <path d="M 2 12 L 18 12" />
        <path d="M 6 12 A 4 4 0 0 1 14 12" />
        <polyline points="7,6 10,9 13,6" />
        <line x1="10" y1="2" x2="10" y2="9" />
      </g>
      <text x="26" y="14" class="time-val">18:29</text>
      <text x="26" y="27" class="status-sub">2h 15m ago</text>
    </g>
  </g>
</svg>
