<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <linearGradient id="musicCoverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c1b4d" />
      <stop offset="50%" stop-color="#1e2246" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="musicOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="musicGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Kártya háttér és keret -->
  <rect width="240" height="180" rx="14" fill="url(#musicCoverGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
  <rect width="240" height="180" rx="14" fill="url(#musicGlow)" />

  <!-- Bakelit lemez / Zene motívum középen fent -->
  <g transform="translate(120, 64)">
    <circle cx="0" cy="0" r="44" fill="#0b0f19" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="0" cy="0" r="36" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="8 3" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="0" cy="0" r="18" fill="#3584e4" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
    <!-- Hangjegy díszítés a lemezcímkén -->
    <path d="M -2 -2 L 3 -4 L 3 3 A 2 2 0 1 1 1 1" fill="none" stroke="#ffffff" stroke-width="1.2" />
  </g>

  <!-- Alsó sötétítő réteg -->
  <rect width="240" height="180" rx="14" fill="url(#musicOverlay)" />

  <!-- Vezérlőgombok alul (Prev, Pause/Play, Next) -->
  <g transform="translate(120, 146)">
    <!-- Előző szám (Prev) -->
    <g transform="translate(-46, 0)">
      <polygon points="6,-6 -2,0 6,6" fill="#ffffff" opacity="0.85" />
      <line x1="-3" y1="-6" x2="-3" y2="6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    </g>

    <!-- Lejátszás / Szünet (Pause) -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="15" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
      <line x1="-4" y1="-6" x2="-4" y2="6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <line x1="4" y1="-6" x2="4" y2="6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Következő szám (Next) -->
    <g transform="translate(46, 0)">
      <polygon points="-6,-6 2,0 -6,6" fill="#ffffff" opacity="0.85" />
      <line x1="3" y1="-6" x2="3" y2="6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    </g>
  </g>
</svg>
