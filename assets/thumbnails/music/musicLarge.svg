<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180">
  <defs>
    <linearGradient id="wideLeftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b1f50" />
      <stop offset="100%" stop-color="#1a1c36" />
    </linearGradient>
    <style>
      .track-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 600; fill: #ffffff; }
      .artist-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #ffffff; opacity: 0.75; }
      .album-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #ffffff; opacity: 0.55; }
    </style>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="360" height="180" rx="14" fill="#1b2330" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- BAL PANEL: 180x180 Albumborító lemezzel -->
  <path d="M 0 14 A 14 14 0 0 1 14 0 L 170 0 L 170 180 L 14 180 A 14 14 0 0 1 0 166 Z" fill="url(#wideLeftGrad)" />
  <g transform="translate(85, 90)">
    <!-- Bakelit lemez a borítóban -->
    <circle cx="0" cy="0" r="54" fill="#0d111a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="0" cy="0" r="34" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="8 4" />
    <circle cx="0" cy="0" r="22" fill="#e0534c" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- JOBB PANEL: Zene info és vezérlők -->
  <g transform="translate(190, 36)">
    <!-- Szövegek -->
    <text x="75" y="20" text-anchor="middle" class="track-title">Midnight City</text>
    <text x="75" y="44" text-anchor="middle" class="artist-sub">M83</text>
    <text x="75" y="64" text-anchor="middle" class="album-sub">Hurry Up, We're Dreaming</text>

    <!-- Vezérlősáv alul -->
    <g transform="translate(75, 102)">
      <!-- Prev -->
      <g transform="translate(-40, 0)">
        <polygon points="5,-6 -2,0 5,6" fill="#ffffff" opacity="0.85" />
        <line x1="-3" y1="-6" x2="-3" y2="6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
      </g>
      <!-- Play/Pause -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="15" fill="#3584e4" />
        <line x1="-4" y1="-5.5" x2="-4" y2="5.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        <line x1="4" y1="-5.5" x2="4" y2="5.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      </g>
      <!-- Next -->
      <g transform="translate(40, 0)">
        <polygon points="-5,-6 2,0 -5,6" fill="#ffffff" opacity="0.85" />
        <line x1="3" y1="-6" x2="3" y2="6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
      </g>
    </g>
  </g>
</svg>
