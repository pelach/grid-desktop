<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <linearGradient id="visBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1c36" />
      <stop offset="100%" stop-color="#0d111a" />
    </linearGradient>
    <linearGradient id="visBarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#56ccf2" />
      <stop offset="100%" stop-color="#2f80ed" />
    </linearGradient>
    <linearGradient id="visDarkOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Kártya háttér és keret -->
  <rect width="240" height="180" rx="14" fill="url(#visBgGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- 16 sávos CAVA Audio Visualizer Equalizer (felülről fut le a bázisvonalhoz) -->
  <g transform="translate(14, 24)">
    <!-- Bázisvonal kb. y = 84-nél -->
    <!-- 1-4. sáv (mély hangok) -->
    <rect x="0" y="52" width="9" height="32" rx="2" fill="url(#visBarGrad)" />
    <rect x="13" y="36" width="9" height="48" rx="2" fill="url(#visBarGrad)" />
    <rect x="26" y="16" width="9" height="68" rx="2" fill="url(#visBarGrad)" />
    <rect x="39" y="8" width="9" height="76" rx="2" fill="url(#visBarGrad)" />

    <!-- 5-8. sáv -->
    <rect x="52" y="24" width="9" height="60" rx="2" fill="url(#visBarGrad)" />
    <rect x="65" y="40" width="9" height="44" rx="2" fill="url(#visBarGrad)" />
    <rect x="78" y="18" width="9" height="66" rx="2" fill="url(#visBarGrad)" />
    <rect x="91" y="4" width="9" height="80" rx="2" fill="url(#visBarGrad)" />

    <!-- 9-12. sáv -->
    <rect x="104" y="14" width="9" height="70" rx="2" fill="url(#visBarGrad)" />
    <rect x="117" y="32" width="9" height="52" rx="2" fill="url(#visBarGrad)" />
    <rect x="130" y="20" width="9" height="64" rx="2" fill="url(#visBarGrad)" />
    <rect x="143" y="10" width="9" height="74" rx="2" fill="url(#visBarGrad)" />

    <!-- 13-16. sáv (magas hangok) -->
    <rect x="156" y="28" width="9" height="56" rx="2" fill="url(#visBarGrad)" />
    <rect x="169" y="44" width="9" height="40" rx="2" fill="url(#visBarGrad)" />
    <rect x="182" y="56" width="9" height="28" rx="2" fill="url(#visBarGrad)" />
    <rect x="195" y="66" width="9" height="18" rx="2" fill="url(#visBarGrad)" />
  </g>

  <!-- Alsó sötétítő réteg a vezérlők mögé -->
  <rect width="240" height="180" rx="14" fill="url(#visDarkOverlay)" />

  <!-- Vezérlősáv alul -->
  <g transform="translate(120, 146)">
    <!-- Prev -->
    <g transform="translate(-46, 0)">
      <polygon points="6,-6 -2,0 6,6" fill="#ffffff" opacity="0.85" />
      <line x1="-3" y1="-6" x2="-3" y2="6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    </g>

    <!-- Pause / Play -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="15" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
      <line x1="-4" y1="-6" x2="-4" y2="6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <line x1="4" y1="-6" x2="4" y2="6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Next -->
    <g transform="translate(46, 0)">
      <polygon points="-6,-6 2,0 -6,6" fill="#ffffff" opacity="0.85" />
      <line x1="3" y1="-6" x2="3" y2="6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    </g>
  </g>
</svg>
