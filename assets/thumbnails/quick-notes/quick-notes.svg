<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <style>
      .widget-bg { fill: #202b38; rx: 14px; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #ffffff; opacity: 0.65; }
      .note-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .note-body { font-family: monospace, system-ui, sans-serif; font-size: 11.5px; fill: #ffffff; }
      .note-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; opacity: 0.85; }
      .pen-icon { fill: none; stroke: #ffffff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
    </style>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="240" height="160" class="widget-bg" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- Fejléc: Cím és Ceruza ikon -->
  <g transform="translate(14, 22)">
    <text x="0" y="2" class="header-title">Quick Notes</text>
    
    <!-- Ceruza (Edit) ikon -->
    <g transform="translate(202, -10)" class="pen-icon">
      <path d="M 2 12 L 12 2 L 15 5 L 5 15 L 1 16 Z" />
      <line x1="10" y1="4" x2="13" y2="7" />
    </g>
  </g>

  <!-- Jegyzet szöveges tartalom -->
  <g transform="translate(16, 44)">
    <text x="0" y="8" class="note-title">Quick Notes</text>
    
    <!-- Checkbox lista -->
    <text x="0" y="32" class="note-body">[ ] Task 1</text>
    <text x="0" y="52" class="note-body">[x] Task 2</text>
    
    <!-- Alsó instrukció (félkövér kiemelés) -->
    <text x="0" y="84" class="note-bold">Click the pen icon to edit</text>
  </g>
</svg>
