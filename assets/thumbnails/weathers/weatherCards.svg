<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <style>
      .widget-bg { fill: #202b38; rx: 14px; }
      .badge-bg { fill: rgba(255, 255, 255, 0.12); rx: 7px; }
      .val-text { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: bold; fill: #ffffff; }
      .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #ffffff; opacity: 0.65; letter-spacing: 0.5px; }
      .chart-card { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; rx: 10px; }
    </style>
    <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="180" height="180" class="widget-bg" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- Fejléc: Érték, Felirat és Badge ikon -->
  <g transform="translate(16, 16)">
    <!-- Érték & Típus -->
    <text x="0" y="20" class="val-text">25%</text>
    <text x="0" y="34" class="label-text">HUMIDITY</text>

    <!-- Jobb felső badge (Időjárás / Pára szimbólum) -->
    <g transform="translate(122, 2)">
      <rect width="26" height="26" class="badge-bg" />
      <circle cx="13" cy="13" r="5" fill="#ffffff" opacity="0.9" />
      <!-- Napsugarak / pöttyök körben -->
      <line x1="13" y1="4" x2="13" y2="6" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
      <line x1="13" y1="20" x2="13" y2="22" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
      <line x1="4" y1="13" x2="6" y2="13" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
      <line x1="20" y1="13" x2="22" y2="13" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
      <line x1="7" y1="7" x2="8" y2="8" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
      <line x1="18" y1="18" x2="19" y2="19" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
      <line x1="18" y1="7" x2="19" y2="8" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
      <line x1="7" y1="18" x2="8" y2="19" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Trendgörbe kártya -->
  <g transform="translate(16, 62)">
    <rect width="148" height="102" class="chart-card" />

    <!-- Trend görbe kitöltés -->
    <path d="M 8 92 
             L 8 82 
             Q 28 88 44 76 
             T 80 44 
             T 114 68 
             T 140 52 
             L 140 92 Z" 
          fill="url(#trendGrad)" />

    <!-- Trend görbe vonal -->
    <path d="M 8 82 
             Q 28 88 44 76 
             T 80 44 
             T 114 68 
             T 140 52" 
          fill="none" stroke="#3584e4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
