<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <!-- Élénk, dinamikus égbolt átmenet -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a75d3" />
      <stop offset="50%" stop-color="#1b5cb8" />
      <stop offset="100%" stop-color="#0f3e82" />
    </linearGradient>

    <!-- Napfény sugárzás átmenet a sarokban -->
    <radialGradient id="sunGlow" cx="100%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffe875" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f6a623" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#2a75d3" stop-opacity="0" />
    </radialGradient>
    
    <style>
      .city-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
      .temp-val { font-family: system-ui, -apple-system, sans-serif; font-size: 34px; font-weight: 300; fill: #ffffff; }
      .temp-unit { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 400; fill: #ffffff; }
      .cond-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #ffffff; opacity: 0.9; }
      .hl-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; fill: #ffffff; opacity: 0.75; letter-spacing: 0.3px; }
    </style>
  </defs>

  <!-- Kártya alap: Kék égbolt -->
  <rect width="180" height="180" rx="14" fill="url(#skyGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />

  <!-- Jobb felső napsugárzás -->
  <rect width="180" height="180" rx="14" fill="url(#sunGlow)" />

  <!-- Nap korong és sugarak -->
  <g transform="translate(180, 0)">
    <circle cx="0" cy="0" r="28" fill="#ffdd55" />
    <!-- Fénycsóvák -->
    <path d="M -45 5 L 0 0 L -40 25 Z" fill="#ffffff" opacity="0.25" />
    <path d="M -30 40 L 0 0 L -10 50 Z" fill="#ffffff" opacity="0.2" />
    <path d="M -55 -15 L 0 0 L -50 10 Z" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- Város neve -->
  <text x="16" y="28" class="city-name">Kathmandu</text>

  <!-- Hőmérséklet (25 °C) -->
  <text x="16" y="68" class="temp-val">25<tspan class="temp-unit">°c</tspan></text>

  <!-- Alsó időjárás blokk: Felhő ikon és szövegek -->
  <g transform="translate(16, 126)">
    <!-- Vektoros felhő ikon -->
    <path d="M 4 18 
             A 5 5 0 0 1 5 8 
             A 7 7 0 0 1 18 6 
             A 6 6 0 0 1 24 12 
             A 6 6 0 0 1 23 18 Z" 
          fill="#ffffff" opacity="0.9" />

    <text x="28" y="16" class="cond-text">Overcast</text>
    <text x="4" y="32" class="hl-text">H:28°c  L:16°c</text>
  </g>
</svg>
