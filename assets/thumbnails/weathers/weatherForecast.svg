<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="360" height="180">
  <defs>
    <linearGradient id="skyGradFore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a75d3" />
      <stop offset="60%" stop-color="#1b5cb8" />
      <stop offset="100%" stop-color="#0f3e82" />
    </linearGradient>
    <radialGradient id="sunGlowFore" cx="100%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffe875" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#f6a623" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#2a75d3" stop-opacity="0" />
    </radialGradient>
    <style>
      .city-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 500; fill: #ffffff; }
      .temp-big { font-family: system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 300; fill: #ffffff; }
      .temp-deg-lg { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 400; fill: #ffffff; }
      .cond-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #ffffff; }
      .highlow-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #ffffff; opacity: 0.75; }
      .hour-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #ffffff; opacity: 0.85; }
      .hour-temp { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .cloud-icon { fill: #ffffff; opacity: 0.9; }
    </style>
  </defs>

  <!-- Kártya háttér -->
  <rect width="360" height="180" rx="14" fill="url(#skyGradFore)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
  <rect width="360" height="180" rx="14" fill="url(#sunGlowFore)" />

  <!-- Napsugárzás a sarokban -->
  <g transform="translate(360, 0)">
    <circle cx="0" cy="0" r="34" fill="#ffdd55" />
    <path d="M -50 8 L 0 0 L -45 30 Z" fill="#ffffff" opacity="0.25" />
    <path d="M -35 48 L 0 0 L -12 60 Z" fill="#ffffff" opacity="0.2" />
  </g>

  <!-- FELSŐ SÁV: Város, Hőmérséklet, Ikon és H/L -->
  <g transform="translate(20, 18)">
    <!-- Bal oldal: Város & Hőmérséklet -->
    <text x="0" y="16" class="city-title">Kathmandu</text>
    <text x="0" y="58" class="temp-big">25<tspan class="temp-deg-lg">°c</tspan></text>

    <!-- Jobb oldal: Felhő, Overcast, Min/Max -->
    <g transform="translate(320, 0)">
      <!-- Vektoros felhő -->
      <path d="M -22 18 A 5 5 0 0 1 -21 8 A 7 7 0 0 1 -8 6 A 6 6 0 0 1 -2 12 A 6 6 0 0 1 -3 18 Z" class="cloud-icon" />
      <text x="0" y="34" text-anchor="end" class="cond-label">Overcast</text>
      <text x="0" y="49" text-anchor="end" class="highlow-label">H:28°c  L:16°c</text>
    </g>
  </g>

  <!-- Középső elválasztó vonal -->
  <line x1="20" y1="92" x2="340" y2="92" stroke="#ffffff" stroke-width="1" opacity="0.2" />

  <!-- ALSÓ SÁV: 5 óránkénti előrejelzés oszlop -->
  <g transform="translate(20, 106)">
    <!-- 1. Óra: 5 PM -->
    <g transform="translate(22, 0)">
      <text x="0" y="10" text-anchor="middle" class="hour-text">5 PM</text>
      <path d="M -8 26 A 3.5 3.5 0 0 1 -7 19 A 5 5 0 0 1 2 18 A 4 4 0 0 1 7 22 A 4 4 0 0 1 6 26 Z" class="cloud-icon" />
      <text x="0" y="44" text-anchor="middle" class="hour-temp">25°</text>
    </g>

    <!-- 2. Óra: 6 PM -->
    <g transform="translate(86, 0)">
      <text x="0" y="10" text-anchor="middle" class="hour-text">6 PM</text>
      <path d="M -8 26 A 3.5 3.5 0 0 1 -7 19 A 5 5 0 0 1 2 18 A 4 4 0 0 1 7 22 A 4 4 0 0 1 6 26 Z" class="cloud-icon" />
      <text x="0" y="44" text-anchor="middle" class="hour-temp">24°</text>
    </g>

    <!-- 3. Óra: 7 PM -->
    <g transform="translate(150, 0)">
      <text x="0" y="10" text-anchor="middle" class="hour-text">7 PM</text>
      <path d="M -8 26 A 3.5 3.5 0 0 1 -7 19 A 5 5 0 0 1 2 18 A 4 4 0 0 1 7 22 A 4 4 0 0 1 6 26 Z" class="cloud-icon" />
      <text x="0" y="44" text-anchor="middle" class="hour-temp">24°</text>
    </g>

    <!-- 4. Óra: 8 PM -->
    <g transform="translate(214, 0)">
      <text x="0" y="10" text-anchor="middle" class="hour-text">8 PM</text>
      <path d="M -8 26 A 3.5 3.5 0 0 1 -7 19 A 5 5 0 0 1 2 18 A 4 4 0 0 1 7 22 A 4 4 0 0 1 6 26 Z" class="cloud-icon" />
      <text x="0" y="44" text-anchor="middle" class="hour-temp">22°</text>
    </g>

    <!-- 5. Óra: 9 PM -->
    <g transform="translate(278, 0)">
      <text x="0" y="10" text-anchor="middle" class="hour-text">9 PM</text>
      <path d="M -8 26 A 3.5 3.5 0 0 1 -7 19 A 5 5 0 0 1 2 18 A 4 4 0 0 1 7 22 A 4 4 0 0 1 6 26 Z" class="cloud-icon" />
      <text x="0" y="44" text-anchor="middle" class="hour-temp">21°</text>
    </g>
  </g>
</svg>
