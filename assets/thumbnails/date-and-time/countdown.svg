<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2a38"/>
      <stop offset="100%" stop-color="#1e1c26"/>
    </linearGradient>
  </defs>

  <!-- Lekerekített widget kártya -->
  <rect x="6" y="6" width="108" height="108" rx="18" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Alap körív -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"/>

  <!-- Visszaszámláló ív + jelölő pötty fent -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="#3584e4" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="251.32" stroke-dashoffset="210"
          transform="rotate(-90 60 60)"/>
  <circle cx="60" cy="20" r="3.5" fill="#3584e4"/>

  <!-- Esemény név -->
  <text x="60" y="44" fill="rgba(255,255,255,0.6)" font-size="9" font-family="Cantarell, sans-serif" font-weight="500" text-anchor="middle">Goal</text>

  <!-- Nap számláló -->
  <text x="60" y="66" fill="#ffffff" font-size="19" font-family="Cantarell, sans-serif" font-weight="300" text-anchor="middle">9 nap</text>

  <!-- Hátralévő pontos idő -->
  <text x="60" y="79" fill="rgba(255,255,255,0.5)" font-size="8" font-family="Cantarell, sans-serif" font-weight="400" text-anchor="middle" letter-spacing="0.5">10:30:59</text>
</svg>
