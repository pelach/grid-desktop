<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 176" width="360" height="176">
  <defs>
    <style>
      .bg { fill: #212126; stroke: rgba(0, 0, 0, 0.75); stroke-width: 1.5; rx: 16px; }
      .title { font-family: 'Cantarell', 'Ubuntu', sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; opacity: 0.9; }
      .sub { font-family: 'Cantarell', 'Ubuntu', sans-serif; font-size: 10.5px; font-weight: 500; fill: #ffffff; opacity: 0.6; }
      .stat { font-family: 'Cantarell', 'Ubuntu', sans-serif; font-size: 11.5px; font-weight: 500; fill: #ffffff; opacity: 0.9; }
      .icon { fill: #ffffff; opacity: 0.85; }
    </style>
  </defs>

  <!-- Kártya háttér -->
  <rect width="358.5" height="174.5" x="0.75" y="0.75" class="bg" />

  <!-- Fejléc (Ikon + Memory + Kapacitás) -->
  <g transform="translate(14, 14)">
    <!-- Meghajtó/RAM ikon -->
    <g transform="translate(0, 1)">
      <rect x="0" y="1" width="15" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.85" />
      <line x1="2" y1="7" x2="13" y2="7" stroke="#ffffff" stroke-width="1" opacity="0.6" />
      <circle cx="11.5" cy="4" r="0.8" fill="#ffffff" opacity="0.85" />
    </g>
    <text x="22" y="10" class="title">Memory</text>
    <text x="22" y="24" class="sub">15.4 GB total</text>
  </g>

  <!-- Bal oldali lista (Pöttyök + Feliratok) -->
  <g transform="translate(14, 52)">
    <!-- Services: 6.3 GB -->
    <g transform="translate(0, 18)">
      <circle cx="4" cy="-4" r="3.5" fill="#ff9800" />
      <text x="14" y="0" class="stat">Services: 6.3 GB</text>
    </g>

    <!-- Cache: 8.4 GB -->
    <g transform="translate(0, 42)">
      <circle cx="4" cy="-4" r="3.5" fill="#ab47bc" />
      <text x="14" y="0" class="stat">Cache: 8.4 GB</text>
    </g>

    <!-- Free: 0.7 GB -->
    <g transform="translate(0, 66)">
      <circle cx="4" cy="-4" r="3.5" fill="#29b6f6" />
      <text x="14" y="0" class="stat">Free: 0.7 GB</text>
    </g>
  </g>

  <!-- Jobb oldali fánkdiagram (cx=263, cy=88, r=48, kerület=301.59, stroke-width=18) -->
  <g transform="translate(263, 88)">
    <!-- Halvány háttérkarika -->
    <circle r="48" fill="none" stroke="#ffffff" stroke-width="18" opacity="0.08" />

    <!-- Services szelet (6.3 / 15.4 = 40.91% -> 123.38 kerületrész) -->
    <circle r="48" fill="none" stroke="#ff9800" stroke-width="18" stroke-dasharray="123.38 178.21" stroke-dashoffset="0" transform="rotate(-90)" />

    <!-- Cache szelet (8.4 / 15.4 = 54.55% -> 164.51 kerületrész) -->
    <circle r="48" fill="none" stroke="#ab47bc" stroke-width="18" stroke-dasharray="164.51 137.08" stroke-dashoffset="-123.38" transform="rotate(-90)" />

    <!-- Free szelet (0.7 / 15.4 = 4.54% -> 13.70 kerületrész) -->
    <circle r="48" fill="none" stroke="#29b6f6" stroke-width="18" stroke-dasharray="13.70 287.89" stroke-dashoffset="-287.89" transform="rotate(-90)" />
  </g>
</svg>