<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 176" width="360" height="176">
  <defs>
    <style>
      .bg { fill: #212126; stroke: rgba(0, 0, 0, 0.75); stroke-width: 1.5; rx: 16px; }
      .title { font-family: 'Cantarell', 'Ubuntu', sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; opacity: 0.9; }
      .stat { font-family: 'Cantarell', 'Ubuntu', sans-serif; font-size: 11.5px; font-weight: 500; fill: #ffffff; opacity: 0.9; }
      .icon { fill: #ffffff; opacity: 0.85; }
      .ring-bg { fill: none; opacity: 0.16; stroke-linecap: round; }
      .ring-val { fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Kártya háttér -->
  <rect width="358.5" height="174.5" x="0.75" y="0.75" class="bg" />

  <!-- Fejléc (Ikon + Resources) -->
  <g transform="translate(14, 14)">
    <path class="icon" d="M1 9.5 L3.5 9.5 L5 4.5 L7.5 13 L9.5 7.5 L11 9.5 L14 9.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="0" y="2" width="15" height="11" rx="2" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.85" />
    <text x="22" y="11" class="title">Resources</text>
  </g>

  <!-- Bal oldali lista (Pöttyök + Feliratok) -->
  <g transform="translate(14, 46)">
    <!-- Disk: 19% -->
    <g transform="translate(0, 16)">
      <circle cx="4" cy="-4" r="3.5" fill="#fff59d" />
      <text x="14" y="0" class="stat">Disk 19%</text>
    </g>

    <!-- RAM: 50% -->
    <g transform="translate(0, 38)">
      <circle cx="4" cy="-4" r="3.5" fill="#a5d6a7" />
      <text x="14" y="0" class="stat">RAM 50%</text>
    </g>

    <!-- Temp: 53° -->
    <g transform="translate(0, 60)">
      <circle cx="4" cy="-4" r="3.5" fill="#ef9a9a" />
      <text x="14" y="0" class="stat">Temp 53°</text>
    </g>

    <!-- CPU: 10% -->
    <g transform="translate(0, 82)">
      <circle cx="4" cy="-4" r="3.5" fill="#90caf9" />
      <text x="14" y="0" class="stat">CPU 10%</text>
    </g>
  </g>

  <!-- Jobb oldali koncentrikus kördiagram (cx=263, cy=88) -->
  <g transform="translate(263, 88)">
    <!-- Disk (r=55, val: 19%) -->
    <circle r="55" class="ring-bg" stroke="#fff59d" stroke-width="5" />
    <circle r="55" class="ring-val" stroke="#fff59d" stroke-width="5" stroke-dasharray="345.57" stroke-dashoffset="279.91" transform="rotate(-90)" />

    <!-- RAM (r=44.55, val: 50%) -->
    <circle r="44.55" class="ring-bg" stroke="#a5d6a7" stroke-width="5" />
    <circle r="44.55" class="ring-val" stroke="#a5d6a7" stroke-width="5" stroke-dasharray="279.91" stroke-dashoffset="139.95" transform="rotate(-90)" />

    <!-- Temp (r=34.1, val: 53%) -->
    <circle r="34.1" class="ring-bg" stroke="#ef9a9a" stroke-width="5" />
    <circle r="34.1" class="ring-val" stroke="#ef9a9a" stroke-width="5" stroke-dasharray="214.25" stroke-dashoffset="100.70" transform="rotate(-90)" />

    <!-- CPU (r=23.65, val: 10%) -->
    <circle r="23.65" class="ring-bg" stroke="#90caf9" stroke-width="5" />
    <circle r="23.65" class="ring-val" stroke="#90caf9" stroke-width="5" stroke-dasharray="148.59" stroke-dashoffset="133.73" transform="rotate(-90)" />
  </g>
</svg>