<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Fő widget kártya -->
  <rect x="4" y="4" width="112" height="72" rx="10" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

  <!-- Fejléc: Terminál ikon -->
  <rect x="12" y="12" width="13" height="9" rx="2" fill="none" stroke="#3584e4" stroke-width="1.2" />
  <path d="M14.5 15 L16.5 16.5 L14.5 18 M17.5 18 L19.5 18" stroke="#3584e4" stroke-width="1.2" stroke-linecap="round" />

  <!-- Fejléc címke & READY felirat -->
  <text x="29" y="19" fill="#ffffff" fill-opacity="0.9" font-family="sans-serif" font-size="6.5" font-weight="bold">Commands</text>
  <text x="108" y="19" fill="#3584e4" font-family="sans-serif" font-size="5.5" font-weight="bold" text-anchor="end" letter-spacing="0.5">READY</text>

  <!-- Sor 1 (Háttérparancs / Drop Caches) -->
  <rect x="10" y="27" width="100" height="19" rx="5" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.8" />
  <!-- Pill gomb -->
  <rect x="13" y="30" width="38" height="13" rx="3.5" fill="#ffffff" fill-opacity="0.12" />
  <!-- Fogaskerék / Run ikon -->
  <circle cx="18" cy="36.5" r="2.2" fill="none" stroke="#3584e4" stroke-width="1" />
  <text x="23" y="38.5" fill="#ffffff" font-family="sans-serif" font-size="5" font-weight="bold">Caches</text>
  <!-- Monospace kimenet -->
  <text x="56" y="38.5" fill="#ffffff" fill-opacity="0.6" font-family="monospace" font-size="4.8">Ready</text>

  <!-- Sor 2 (Terminál / SSH) -->
  <rect x="10" y="49" width="100" height="19" rx="5" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.8" />
  <!-- Pill gomb -->
  <rect x="13" y="52" width="38" height="13" rx="3.5" fill="#ffffff" fill-opacity="0.12" />
  <!-- Terminál mini ikon -->
  <path d="M16 57 L18 58.5 L16 60 M19 60 L20.5 60" stroke="#3584e4" stroke-width="0.9" stroke-linecap="round" />
  <text x="23" y="60.5" fill="#ffffff" font-family="sans-serif" font-size="5" font-weight="bold">SSH</text>
  <!-- Monospace SSH prompt -->
  <text x="56" y="60.5" fill="#ffffff" fill-opacity="0.6" font-family="monospace" font-size="4.5">$ ssh user@srv</text>
</svg>