<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170">
  <defs>
    <style>
      .widget-bg { fill: #202b38; rx: 14px; }
      .title-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; opacity: 0.65; }
      .count-label { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 300; fill: #ffffff; }
      .btn-add { fill: rgba(53, 132, 228, 0.15); rx: 16px; }
      .task-card { fill: rgba(53, 132, 228, 0.08); rx: 10px; }
      .task-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #ffffff; }
      .task-text-done { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #ffffff; opacity: 0.45; text-decoration: line-through; }
      .checkbox-empty { fill: none; stroke: rgba(255, 255, 255, 0.35); stroke-width: 1.5; }
      .checkbox-done { fill: #3584e4; }
      .icon-stroke { fill: none; stroke: #3584e4; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .del-icon { fill: none; stroke: #ffffff; stroke-width: 1.5; stroke-linecap: round; opacity: 0.4; }
    </style>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="360" height="170" class="widget-bg" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- BAL OLDALI OSZLOP: Tasks cím, számláló és + gomb -->
  <g transform="translate(20, 18)">
    <text x="0" y="11" class="title-label">Tasks</text>

    <!-- Lista ikon és függőben lévő feladatok száma -->
    <g transform="translate(0, 24)">
      <!-- Mini lista ikon -->
      <line x1="2" y1="6" x2="6" y2="6" class="icon-stroke" />
      <line x1="9" y1="6" x2="18" y2="6" class="icon-stroke" />
      <line x1="2" y1="12" x2="6" y2="12" class="icon-stroke" />
      <line x1="9" y1="12" x2="18" y2="12" class="icon-stroke" />
      <line x1="2" y1="18" x2="6" y2="18" class="icon-stroke" />
      <line x1="9" y1="18" x2="18" y2="18" class="icon-stroke" />

      <text x="28" y="18" class="count-label">2</text>
    </g>

    <!-- Kerek hozzáadás (+) gomb alul -->
    <g transform="translate(0, 94)">
      <rect width="32" height="32" class="btn-add" />
      <line x1="16" y1="10" x2="16" y2="22" stroke="#3584e4" stroke-width="2" stroke-linecap="round" />
      <line x1="10" y1="16" x2="22" y2="16" stroke="#3584e4" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- JOBB OLDALI OSZLOP: Feladatlista sorok -->
  <g transform="translate(105, 16)">
    <!-- 1. Feladat: Aktív (Make tea) -->
    <g transform="translate(0, 0)">
      <rect width="232" height="38" class="task-card" />
      <!-- Üres kerek checkbox -->
      <circle cx="20" cy="19" r="8" class="checkbox-empty" />
      <text x="38" y="23" class="task-text">Make tea</text>
      <!-- Törlés ikon (x) -->
      <path d="M 212 15 L 218 21 M 218 15 L 212 21" class="del-icon" />
    </g>

    <!-- 2. Feladat: Kész pipa (Linux os) -->
    <g transform="translate(0, 46)">
      <rect width="232" height="38" class="task-card" />
      <!-- Pipált checkbox -->
      <circle cx="20" cy="19" r="8" class="checkbox-done" />
      <polyline points="16,19 19,22 24,16" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="38" y="23" class="task-text-done">Linux os</text>
      <!-- Törlés ikon -->
      <path d="M 212 15 L 218 21 M 218 15 L 212 21" class="del-icon" />
    </g>

    <!-- 3. Feladat: Aktív (Deploy update) -->
    <g transform="translate(0, 92)">
      <rect width="232" height="38" class="task-card" />
      <!-- Üres kerek checkbox -->
      <circle cx="20" cy="19" r="8" class="checkbox-empty" />
      <text x="38" y="23" class="task-text">Deploy update</text>
      <!-- Törlés ikon -->
      <path d="M 212 15 L 218 21 M 218 15 L 212 21" class="del-icon" />
    </g>
  </g>
</svg>
