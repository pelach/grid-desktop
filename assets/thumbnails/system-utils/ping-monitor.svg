<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Kártya finom szegély/árnyék hatás -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a30" />
      <stop offset="100%" stop-color="#212126" />
    </linearGradient>
    <!-- Sparkline alsó kitöltése -->
    <linearGradient id="sparkFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Fő kártya háttér -->
  <rect x="8" y="8" width="104" height="104" rx="14" ry="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />

  <!-- Jobb felső kis ikon dobozka -->
  <rect x="84" y="18" width="20" height="20" rx="5" ry="5" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <!-- Hálózati szimbolikus ikon -->
  <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <rect x="87.5" y="24" width="13" height="8" rx="2" ry="2" />
    <circle cx="91" cy="28" r="0.6" fill="#ffffff" />
    <circle cx="94" cy="28" r="0.6" fill="#ffffff" />
    <circle cx="97" cy="28" r="0.6" fill="#ffffff" />
  </g>

  <!-- Szöveges adatok: 14 ms + zöld pötty -->
  <text x="18" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#ffffff">14</text>
  <text x="42" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#ffffff" opacity="0.55">ms</text>
  <circle cx="61" cy="28" r="2.5" fill="#33d17a" />

  <!-- Host címke -->
  <text x="18" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#ffffff" opacity="0.55">Cloudflare</text>

  <!-- Alsó chart tálca / konténer -->
  <rect x="18" y="58" width="84" height="42" rx="7" ry="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Sparkline görbe és terület -->
  <path d="M 23 88 
           Q 30 87, 36 86 
           T 48 88 
           T 60 84 
           T 72 87 
           T 84 86 
           T 95 72 
           L 95 95 
           L 23 95 Z" fill="url(#sparkFill)" />

  <path d="M 23 88 
           Q 30 87, 36 86 
           T 48 88 
           T 60 84 
           T 72 87 
           T 84 86 
           T 95 72" fill="none" stroke="#3584e4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
