<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .widget-bg { fill: #202b38; rx: 14px; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; opacity: 0.9; }
      .row-card { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.07); stroke-width: 1; rx: 8px; }
      .row-card-active { fill: rgba(255, 255, 255, 0.18); stroke: rgba(255, 255, 255, 0.35); stroke-width: 1; rx: 8px; }
      .prof-name { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 500; fill: #ffffff; }
      .icon-stroke { fill: none; stroke: #ffffff; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="200" height="200" class="widget-bg" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- Fejléc -->
  <g transform="translate(14, 16)">
    <!-- Speedometer / Gauge Icon -->
    <path d="M 2 12 A 8 8 0 1 1 16 12" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
    <line x1="9" y1="11" x2="13" y2="7" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
    <text x="24" y="11" class="header-title">Energy management</text>
  </g>

  <!-- 1. Gomb: Power saver -->
  <g transform="translate(12, 38)">
    <rect width="176" height="38" class="row-card" />
    <!-- Levélke / takarékos ikon -->
    <path d="M 12 24 C 12 16 19 14 26 14 C 26 21 24 28 16 28 C 14 28 12 26 12 24 Z" 
          fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.8" />
    <line x1="12" y1="28" x2="19" y2="21" stroke="#ffffff" stroke-width="1.3" opacity="0.8" />
    <text x="36" y="23" class="prof-name" opacity="0.85">Power saver</text>
  </g>

  <!-- 2. Gomb (Aktív): Balanced -->
  <g transform="translate(12, 82)">
    <rect width="176" height="38" class="row-card-active" />
    <!-- Balanced óra ikon -->
    <circle cx="20" cy="19" r="8" fill="none" stroke="#ffffff" stroke-width="1.4" />
    <polyline points="20,15 20,19 23,21" fill="none" stroke="#ffffff" stroke-width="1.4" />
    <text x="36" y="23" class="prof-name">Balanced</text>
    <!-- Kiválasztott pipa -->
    <polyline points="152,18 156,22 164,13" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 3. Gomb: Performance -->
  <g transform="translate(12, 126)">
    <rect width="176" height="38" class="row-card" />
    <!-- Villám / Performance ikon -->
    <polygon points="21,11 15,19 19,19 18,27 25,18 21,18" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.8" />
    <text x="36" y="23" class="prof-name" opacity="0.85">Performance</text>
  </g>
</svg>
