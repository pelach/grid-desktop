<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170">
  <defs>
    <style>
      .main-bg { fill: #202b38; }
      .side-bg { fill: #263342; }
      .time-header { font-family: system-ui, -apple-system, sans-serif; font-size: 30px; font-weight: 300; fill: #ffffff; }
      .date-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; opacity: 0.65; }
      .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #ffffff; opacity: 0.65; }
      .app-time { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #ffffff; opacity: 0.75; }
      .btn-nav { fill: transparent; stroke: rgba(255, 255, 255, 0.14); stroke-width: 1; rx: 5px; }
      .grid-line { stroke: rgba(255, 255, 255, 0.18); stroke-width: 1; stroke-dasharray: 2, 2; }
      .bar-accent { fill: #3584e4; }
    </style>
  </defs>

  <!-- Fő widget háttér és keret -->
  <rect width="360" height="170" rx="14" fill="#202b38" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- JOBB OLDALI SÁV (Alkalmazás lista világosabb háttérrel) -->
  <path d="M 234 0 L 346 0 A 14 14 0 0 1 360 14 L 360 156 A 14 14 0 0 1 346 170 L 234 170 Z" class="side-bg" />

  <!-- BAL PANEL: Fejléc, Idő és Lapozó -->
  <g transform="translate(18, 16)">
    <text x="0" y="26" class="time-header">45m</text>

    <!-- Dátum és < > lapozó gombok -->
    <g transform="translate(150, 0)">
      <text x="44" y="9" text-anchor="end" class="date-label">27 Aug</text>
      <rect x="5" y="16" width="20" height="20" class="btn-nav" />
      <path d="M 16 22 L 12 26 L 16 30" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.65" stroke-linecap="round" stroke-linejoin="round" />

      <rect x="29" y="16" width="20" height="20" class="btn-nav" />
      <path d="M 37 22 L 41 26 L 37 30" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.65" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Óránkénti diagram és rács -->
    <g transform="translate(0, 48)">
      <!-- Szaggatott rácsvonalak -->
      <line x1="0" y1="1" x2="164" y2="1" class="grid-line" />
      <line x1="0" y1="31" x2="164" y2="31" class="grid-line" />
      <line x1="0" y1="62" x2="164" y2="62" class="grid-line" />

      <line x1="1" y1="0" x2="1" y2="62" class="grid-line" />
      <line x1="82" y1="0" x2="82" y2="62" class="grid-line" />
      <line x1="164" y1="0" x2="164" y2="62" class="grid-line" />

      <!-- Y tengely címkék (jobbra zártan) -->
      <text x="196" y="5" text-anchor="end" class="axis-label">45m</text>
      <text x="196" y="34" text-anchor="end" class="axis-label">22m</text>
      <text x="196" y="65" text-anchor="end" class="axis-label">0</text>

      <!-- Aktív óránkénti oszlopok -->
      <rect x="42" y="42" width="4" height="20" rx="2" class="bar-accent" />
      <rect x="58" y="24" width="4" height="38" rx="2" class="bar-accent" />
      <rect x="74" y="36" width="4" height="26" rx="2" class="bar-accent" />
      <rect x="96" y="12" width="4" height="50" rx="2" class="bar-accent" />
      <rect x="110" y="28" width="4" height="34" rx="2" class="bar-accent" />
      <rect x="132" y="48" width="4" height="14" rx="2" class="bar-accent" />
      <rect x="146" y="54" width="4" height="8" rx="2" class="bar-accent" />

      <!-- X tengely időpontok -->
      <text x="2" y="77" class="axis-label">00:00</text>
      <text x="82" y="77" text-anchor="middle" class="axis-label">12:00</text>
      <text x="162" y="77" text-anchor="end" class="axis-label">24:00</text>
    </g>
  </g>

  <!-- JOBB PANEL: Legaktívabb alkalmazások (Ikon + Időtartam) -->
  <g transform="translate(250, 22)">
    <!-- 1. App: Böngésző (pl. Firefox) -->
    <g transform="translate(0, 0)">
      <circle cx="10" cy="10" r="9" fill="#ff7139" />
      <circle cx="10" cy="10" r="5" fill="#ffd13b" />
      <text x="28" y="14" class="app-time">18m</text>
    </g>

    <!-- 2. App: Szerkesztő / Fejlesztés (pl. VS Code) -->
    <g transform="translate(0, 30)">
      <rect x="1" y="1" width="18" height="18" rx="4" fill="#007acc" />
      <path d="M 6 6 L 14 10 L 6 14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="14" class="app-time">14m</text>
    </g>

    <!-- 3. App: Terminál -->
    <g transform="translate(0, 60)">
      <rect x="1" y="1" width="18" height="18" rx="4" fill="#300a24" stroke="rgba(255,255,255,0.2)" stroke-width="0.8" />
      <path d="M 5 7 L 8 10 L 5 13" fill="none" stroke="#4af626" stroke-width="1.4" stroke-linecap="round" />
      <line x1="9" y1="13" x2="13" y2="13" stroke="#ffffff" stroke-width="1.4" />
      <text x="28" y="14" class="app-time">8m</text>
    </g>

    <!-- 4. App: Zene / Lejátszó -->
    <g transform="translate(0, 90)">
      <circle cx="10" cy="10" r="9" fill="#1db954" />
      <path d="M 5 8 C 8 7 12 7 15 9 M 6 11 C 9 10 11 10 14 12 M 7 14 C 9 13 11 13 13 14" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
      <text x="28" y="14" class="app-time">5m</text>
    </g>
  </g>
</svg>
