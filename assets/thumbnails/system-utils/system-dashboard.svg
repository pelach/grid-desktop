<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <defs>
    <style>
      .widget-bg { fill: #202b38; rx: 16px; }
      .card-bg { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.07); stroke-width: 1; rx: 12px; }
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #ffffff; opacity: 0.65; }
      .badge-bg { fill: rgba(255, 255, 255, 0.08); rx: 10px; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
      .net-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #ffffff; opacity: 0.65; }
      .net-val { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 300; fill: #ffffff; }
      .net-unit { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #ffffff; opacity: 0.65; }
    </style>
    <!-- CPU kitöltés színátmenet -->
    <linearGradient id="cpuGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="240" height="260" class="widget-bg" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- 1. KÁRTYA: Processor -->
  <rect x="12" y="12" width="216" height="140" class="card-bg" />

  <!-- Processor Header -->
  <text x="26" y="36" class="title-text">Processor</text>
  <rect x="174" y="23" width="40" height="18" class="badge-bg" />
  <text x="182" y="36" class="badge-text">26%</text>

  <!-- CPU Trend Chart (kitöltés + vonal) -->
  <path d="M 26 136 
           L 26 122 
           L 46 120 
           L 62 125 
           L 78 114 
           L 96 118 
           L 112 84 
           L 126 96 
           L 142 80 
           L 158 108 
           L 174 102 
           L 190 126 
           L 214 120 
           L 214 136 Z" 
        fill="url(#cpuGradient)" />

  <path d="M 26 122 
           L 46 120 
           L 62 125 
           L 78 114 
           L 96 118 
           L 112 84 
           L 126 96 
           L 142 80 
           L 158 108 
           L 174 102 
           L 190 126 
           L 214 120" 
        fill="none" stroke="#3584e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 2. KÁRTYA: Network -->
  <rect x="12" y="162" width="216" height="86" class="card-bg" />

  <!-- Download Stat -->
  <text x="26" y="188" class="net-label">Download</text>
  <text x="26" y="222" class="net-val">56<tspan class="net-unit"> KB/s</tspan></text>

  <!-- Upload Stat -->
  <text x="134" y="188" class="net-label">Upload</text>
  <text x="134" y="222" class="net-val">25<tspan class="net-unit"> KB/s</tspan></text>
</svg>
