<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <style>
      .widget-bg { fill: #202b38; rx: 14px; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; opacity: 0.9; }
      .row-card { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.07); stroke-width: 1; rx: 10px; }
      .dev-name { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #ffffff; }
      .dev-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #ffffff; opacity: 0.65; }
      .pct-val { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .icon-stroke { fill: none; stroke: #ffffff; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="240" height="200" class="widget-bg" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- Fejléc -->
  <g transform="translate(14, 16)">
    <!-- Battery Header Icon -->
    <rect x="0" y="2" width="16" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <path d="M 17 5 L 17 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <rect x="2" y="4" width="10" height="5" fill="#ffffff" rx="1" />
    <text x="24" y="11" class="header-title">Battery Status</text>
  </g>

  <!-- 1. ESZKÖZ KÁRTYA: Laptop (This PC) -->
  <g transform="translate(12, 42)">
    <rect width="216" height="66" class="row-card" />
    
    <!-- Laptop Icon -->
    <g transform="translate(12, 18)" class="icon-stroke">
      <rect x="3" y="2" width="22" height="15" rx="1.5" stroke-width="1.6" />
      <line x1="0" y1="21" x2="28" y2="21" stroke-width="2" />
    </g>

    <!-- Név & Állapot -->
    <text x="48" y="29" class="dev-name">This PC</text>
    <text x="48" y="47" class="dev-sub">Charging</text>

    <!-- Százalék & Akku ikon -->
    <text x="160" y="38" class="pct-val" text-anchor="end">98%</text>
    <g transform="translate(168, 25)">
      <rect x="0" y="2" width="22" height="13" rx="2.5" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.85" />
      <path d="M 23 6 L 23 11" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
      <rect x="2.5" y="4.5" width="15" height="8" rx="1" fill="#ffffff" opacity="0.85" />
      <!-- Kis villám szimbólum töltéshez -->
      <polygon points="12,1 7,8 11,8 10,14 15,7 11,7" fill="#ffffff" />
    </g>
  </g>

  <!-- 2. ESZKÖZ KÁRTYA: Fejhallgató -->
  <g transform="translate(12, 118)">
    <rect width="216" height="66" class="row-card" />
    
    <!-- Headset Icon -->
    <g transform="translate(14, 18)" class="icon-stroke" stroke-width="1.6">
      <path d="M 3 14 A 11 11 0 0 1 25 14" />
      <rect x="1" y="13" width="5" height="10" rx="2" fill="#ffffff" fill-opacity="0.3" />
      <rect x="22" y="13" width="5" height="10" rx="2" fill="#ffffff" fill-opacity="0.3" />
    </g>

    <!-- Név & Állapot -->
    <text x="48" y="29" class="dev-name">picun NC60</text>
    <text x="48" y="47" class="dev-sub">Connected</text>

    <!-- Százalék & Akku ikon -->
    <text x="160" y="38" class="pct-val" text-anchor="end">100%</text>
    <g transform="translate(168, 25)">
      <rect x="0" y="2" width="22" height="13" rx="2.5" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.85" />
      <path d="M 23 6 L 23 11" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
      <rect x="2.5" y="4.5" width="17" height="8" rx="1" fill="#ffffff" opacity="0.85" />
    </g>
  </g>
</svg>
