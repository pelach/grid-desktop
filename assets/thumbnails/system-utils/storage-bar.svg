<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 280 130"
   width="280"
   height="130"
   version="1.1"
   id="svg16"
   sodipodi:docname="storage-bar.svg"
   inkscape:version="1.4 (e7c3feb100, 2024-10-09)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview16"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="4.1285714"
     inkscape:cx="140"
     inkscape:cy="64.913495"
     inkscape:window-width="1289"
     inkscape:window-height="991"
     inkscape:window-x="26"
     inkscape:window-y="23"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg16" />
  <defs
     id="defs2">
    <!-- Kártya háttér -->
    <linearGradient
       id="cardBg"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#2a2a30"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#212126"
         id="stop2" />
    </linearGradient>
    <!-- Szegmentált sáv clip-path a szép lekerekítéshez -->
    <clipPath
       id="barClip">
      <rect
         x="18"
         y="66"
         width="244"
         height="12"
         rx="6"
         ry="6"
         id="rect2" />
    </clipPath>
  </defs>
  <!-- 1. Kártya alapdoboz -->
  <rect
     x="4"
     y="4"
     width="272"
     height="122"
     rx="16"
     ry="16"
     fill="url(#cardBg)"
     stroke="rgba(255,255,255,0.08)"
     stroke-width="1.2"
     id="rect3" />
  <!-- 2. Jobb felső ikon dobozka (System Info & Ping minta) -->
  <rect
     x="236"
     y="16"
     width="26"
     height="26"
     rx="6"
     ry="6"
     fill="rgba(255,255,255,0.08)"
     stroke="rgba(255,255,255,0.08)"
     stroke-width="1"
     id="rect4" />
  <!-- Merevlemez szimbolikus ikon -->
  <g
     fill="none"
     stroke="#ffffff"
     stroke-width="1.3"
     stroke-linecap="round"
     stroke-linejoin="round"
     opacity="0.65"
     id="g5">
    <rect
       x="240.5"
       y="24"
       width="17"
       height="10"
       rx="2"
       ry="2"
       id="rect5" />
    <line
       x1="243.5"
       y1="30.5"
       x2="249.5"
       y2="30.5"
       id="line5" />
    <circle
       cx="254"
       cy="30.5"
       r="0.8"
       fill="#ffffff"
       id="circle5" />
  </g>
  <!-- 3. Fejléc: Szabad hely adatai balra -->
  <!-- Nagy érték + GB -->
  <text
     x="18"
     y="38"
     font-family="system-ui, '-apple-system', sans-serif"
     font-size="24px"
     font-weight="600"
     fill="#ffffff"
     id="text5">145.3GB</text>
  <text
     x="108.32703"
     y="29.367001"
     font-family="system-ui, '-apple-system', sans-serif"
     font-size="11px"
     font-weight="400"
     fill="#ffffff"
     opacity="0.55"
     id="text6">free</text>
  <!-- Halvány alcím -->
  <text
     x="18"
     y="52"
     font-family="system-ui, '-apple-system', sans-serif"
     font-size="11px"
     font-weight="400"
     fill="#ffffff"
     opacity="0.45"
     id="text7">Total: 256 GB (NVMe SSD)</text>
  <!-- 4. Szegmentált Cairo/Storage sáv -->
  <!-- Tálca háttér (szabad hely) -->
  <rect
     x="18"
     y="66"
     width="244"
     height="12"
     rx="6"
     ry="6"
     fill="rgba(255,255,255,0.08)"
     id="rect7" />
  <!-- Színes szegmensek a levágó maszkon belül -->
  <g
     clip-path="url(#barClip)"
     id="g12">
    <!-- Rendszer: Kék (~38 px) -->
    <rect
       x="18"
       y="66"
       width="40"
       height="12"
       fill="#3584e4"
       id="rect8" />
    <!-- Média (Videó + Audio): Lila (~30 px) -->
    <rect
       x="58"
       y="66"
       width="30"
       height="12"
       fill="#9141ac"
       id="rect9" />
    <!-- Archívum / Csomagok: Narancs (~26 px) -->
    <rect
       x="88"
       y="66"
       width="26"
       height="12"
       fill="#e66100"
       id="rect10" />
    <!-- Képek: Zöld (~10 px) -->
    <rect
       x="114"
       y="66"
       width="10"
       height="12"
       fill="#33d17a"
       id="rect11" />
    <!-- Dokumentumok: Sárga (~6 px) -->
    <rect
       x="124"
       y="66"
       width="8"
       height="12"
       fill="#f6d32d"
       id="rect12" />
  </g>
  <!-- 5. Jelmagyarázat (Legend) színes pöttyökkel alul -->
  <!-- Rendszer -->
  <circle
     cx="21"
     cy="98"
     r="3"
     fill="#3584e4"
     id="circle12" />
  <text
     x="28"
     y="101"
     font-family="system-ui, '-apple-system', sans-serif"
     font-size="9px"
     fill="#ffffff"
     opacity="0.75"
     id="text12">System: 42 GB</text>
  <!-- Média -->
  <circle
     cx="106"
     cy="98"
     r="3"
     fill="#9141ac"
     id="circle13" />
  <text
     x="113"
     y="101"
     font-family="system-ui, '-apple-system', sans-serif"
     font-size="9px"
     fill="#ffffff"
     opacity="0.75"
     id="text13">Media: 29 GB</text>
  <!-- Archívum -->
  <circle
     cx="186"
     cy="98"
     r="3"
     fill="#e66100"
     id="circle14" />
  <text
     x="193"
     y="101"
     font-family="system-ui, '-apple-system', sans-serif"
     font-size="9px"
     fill="#ffffff"
     opacity="0.75"
     id="text14">Archive: 25 GB</text>
  <!-- Alsó sor kisebb elemek / szabad hely arány -->
  <circle
     cx="21"
     cy="113"
     r="3"
     fill="#f6d32d"
     id="circle15" />
  <text
     x="28"
     y="116"
     font-family="system-ui, '-apple-system', sans-serif"
     font-size="9px"
     fill="#ffffff"
     opacity="0.6"
     id="text15">Docs: 15 GB</text>
  <circle
     cx="88.387543"
     cy="113"
     r="3"
     fill="rgba(255,255,255,0.25)"
     id="circle16" />
  <text
     x="96.114189"
     y="116"
     font-family="system-ui, '-apple-system', sans-serif"
     font-size="9px"
     fill="#ffffff"
     opacity="0.6"
     id="text16">Free: 145 GB</text>
</svg>
