<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <style>
      .widget-bg { fill: #202b38; rx: 14px; }
      .titlebar-bg { fill: rgba(255, 255, 255, 0.04); }
      .source-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #ffffff; opacity: 0.85; }
      .article-head { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .article-body { font-family: monospace, system-ui, sans-serif; font-size: 11px; fill: #ffffff; opacity: 0.65; line-height: 1.4; }
      .time-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #ffffff; opacity: 0.65; }
      .dot-active { fill: #ffffff; rx: 2px; }
      .dot-idle { fill: rgba(255, 255, 255, 0.27); rx: 1px; }
    </style>
  </defs>

  <!-- Fő widget háttér -->
  <rect width="240" height="240" class="widget-bg" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />

  <!-- 1. Fejléc: Címsor sáv és forrásnév -->
  <path d="M 0 14 A 14 14 0 0 1 14 0 L 226 0 A 14 14 0 0 1 240 14 L 240 34 L 0 34 Z" class="titlebar-bg" />
  <line x1="0" y1="34" x2="240" y2="34" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  
  <!-- Mini RSS ikon és név -->
  <g transform="translate(14, 13)">
    <circle cx="2" cy="10" r="1.5" fill="#ffffff" opacity="0.85" />
    <path d="M 0 5 A 7 7 0 0 1 7 12" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.85" />
    <path d="M 0 1 A 11 11 0 0 1 11 12" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.85" />
    <text x="18" y="10" class="source-title">Feed</text>
  </g>

  <!-- 2. Tartalmi rész: Cím és kivonat -->
  <g transform="translate(16, 56)">
    <text x="0" y="12" class="article-head">Title</text>

    <!-- Szövegrészlet több sorban -->
    <text x="0" y="38" class="article-body">Feed description Lorem</text>
    <text x="0" y="54" class="article-body">ipsum dolor sit amet,</text>
    <text x="0" y="70" class="article-body">consectetur adipiscing</text>
    <text x="0" y="86" class="article-body">elit. Etiam in lorem</text>
    <text x="0" y="102" class="article-body">sagittis, congue dui sit</text>
    <text x="0" y="118" class="article-body">amet, imperdiet urna.</text>
  </g>

  <!-- 3. Lábléc: Idő és lapozópöttyök -->
  <line x1="0" y1="206" x2="240" y2="206" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <g transform="translate(16, 216)">
    <text x="0" y="10" class="time-sub">1h ago</text>

    <!-- Lapozó indikátor pontok jobb oldalon -->
    <g transform="translate(160, 5)">
      <rect x="0" y="0" width="10" height="4" class="dot-active" />
      <rect x="14" y="0" width="4" height="4" class="dot-idle" />
      <rect x="22" y="0" width="4" height="4" class="dot-idle" />
      <rect x="30" y="0" width="4" height="4" class="dot-idle" />
      <rect x="38" y="0" width="4" height="4" class="dot-idle" />
    </g>
  </g>
</svg>
