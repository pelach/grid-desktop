<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Maszk a középső kivágáshoz -->
    <mask id="hole-mask">
      <rect width="200" height="200" fill="white" />
      <circle cx="100" cy="100" r="45" fill="black" />
    </mask>
  </defs>

  <g mask="url(#hole-mask)">
    <!-- Fekete bakelit alap -->
    <circle cx="100" cy="100" r="98" fill="#121212" stroke="#222222" stroke-width="2"/>
    
    <!-- Koncentrikus barázdák -->
    <circle cx="100" cy="100" r="92" fill="none" stroke="#202020" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="100" cy="100" r="84" fill="none" stroke="#222222" stroke-width="1.2"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#181818" stroke-width="1"/>
    <circle cx="100" cy="100" r="75" fill="none" stroke="#242424" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="100" cy="100" r="65" fill="none" stroke="#222222" stroke-width="1.2"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#181818" stroke-width="1"/>
    <circle cx="100" cy="100" r="55" fill="none" stroke="#262626" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="50" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="100" cy="100" r="46" fill="none" stroke="#333333" stroke-width="1.5"/>
  </g>
</svg>
